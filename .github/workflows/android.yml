
name: Build Kurse Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kurse-launcher-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"
          TOOLS="$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/cmdline-tools"
          mkdir -p "$RUNNER_TEMP/android-cli-download"

          echo "Downloading Google's Android command-line tools..."

          curl --fail --location --retry 5 \
            --retry-all-errors --retry-delay 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            --output "$RUNNER_TEMP/android-cli-download/tools.zip"

          unzip -q "$RUNNER_TEMP/android-cli-download/tools.zip" \
            -d "$RUNNER_TEMP/android-cli-download"

          test -x "$RUNNER_TEMP/android-cli-download/cmdline-tools/bin/sdkmanager"

          mv "$RUNNER_TEMP/android-cli-download/cmdline-tools" "$TOOLS"

          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          "$TOOLS/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          mkdir -p "$ANDROID_HOME/licenses"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses < <(yes)

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

          echo "Android SDK verification passed."

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project files..."

          test -f settings.gradle -o -f settings.gradle.kts
          test -d app
          test -f app/build.gradle -o -f app/build.gradle.kts

          echo "Project structure verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated or is empty."
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          ls -lh "$APK"
          echo "APK verification passed."

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kurse-Launcher-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
