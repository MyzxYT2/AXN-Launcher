
name: Build Kurse Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          curl -fL \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/android-tools.zip"

          unzip -q "$RUNNER_TEMP/android-tools.zip" \
            -d "$RUNNER_TEMP/android-tools"

          mv "$RUNNER_TEMP/android-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          sdkmanager --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses

          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kurse-Launcher-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
